# Быстрый гейт: сборка нативного CLAP-тест-плагина и полный dotnet test
# на каждый push в dev/main и на pull request. Теговые полосы (beta/release)
# живут отдельно - .github/workflows/beta.yml и release.yml; структуру полос
# держит вместе tools/check-workflows.ps1.
name: ci

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

permissions:
  contents: read

jobs:
  test:
    name: dotnet test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Нативные тест-плагины (bat: CLAP + VST3 + шим)
        shell: pwsh
        run: |
          $bats = @(
            'tests\Parrhesia.Plugins.Native\build-test-plugin.bat',
            'tests\Parrhesia.Plugins.Native\vst3-test-plugin\build-vst3-test-plugin.bat',
            'src\Parrhesia.Plugins\native\vst3-shim\build-vst3-shim.bat'
          )
          foreach ($b in $bats) {
            cmd /c $b
            if ($LASTEXITCODE -ne 0) { throw "сборка нативных артефактов провалена: $b" }
          }
      - name: dotnet test (полный гейт)
        run: dotnet test Parrhesia.slnx --nologo
